[project]
name = "arrhythmia-detector-backend"
version = "2.0.0"
description = "ECG arrhythmia beat classifier -- AAMI EC57 inter-patient pipeline, training, and inference API"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PyWavelets>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ecg_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
