[project]
name = "arrhythmia-detector-backend"
version = "2.0.0"
description = "ECG arrhythmia beat classifier -- AAMI EC57 inter-patient pipeline, training, and inference API"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.1",
    "scipy==1.18.0",
    "PyWavelets==1.9.0",
    "wfdb==4.3.1",
    "pandas==3.0.3",
    "scikit-learn==1.9.0",
    "tensorflow==2.21.0",
    "joblib==1.5.3",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.50.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ecg_pipeline*", "training*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
