[project]
name = "arrhythmia-detector-backend"
version = "2.0.0"
description = "ECG arrhythmia beat classifier -- AAMI EC57 inter-patient pipeline, training, and inference API"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PyWavelets>=1.5",
    "wfdb>=4.1",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "tensorflow>=2.16",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ecg_pipeline*", "training*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
