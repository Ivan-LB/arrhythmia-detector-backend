name: Tests

on:
  push:
    branches: [main, v2.0.0]
  pull_request:
    branches: [main, v2.0.0]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest tests/ -q
